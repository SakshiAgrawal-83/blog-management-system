<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
       <nav>
    <h2>Blog Hub</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="addBlog.html">Add Blog</a>
    </div>
</nav>
    </header>
    <main>

        <h1 align="center">Add New Blog</h1>

        <br/>
       <form id="blogForm">

    <label for="title">Blog Title</label><br>
    <input type="text" id="title" name="title">
    <small id="titleError" class="error"></small>
    <br><br>

    <label for="author">Author Name</label><br>
    <input type="text" id="author" name="author">
    <small id="authorError" class="error"></small>
    <br><br>

    <label for="category">Category</label><br>
    <select id="category" name="category">
        <option value="">Select Category</option>
        <option>Technology</option>
        <option>Education</option>
        <option>Travel</option>
        <option>Lifestyle</option>
        <option>Food</option>
    </select>
    <small id="categoryError" class="error"></small>
    <br><br>

    <label for="content">Blog Content</label><br>
    <textarea id="content" rows="8" cols="50"></textarea>
    <small id="contentError" class="error"></small>
    <br><br>

    <button type="submit">Publish Blog</button>

    <p id="successMessage"></p>

</form>

<script src="Script.js"></script>

    </main>

    <footer>
        <p>&copy; 2026 Blog Hub. All Rights Reserved.</p>
    </footer>
<script src="Script.js"></script>
</body>
</html>
